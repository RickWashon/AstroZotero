name: Publish AstroZotero v0.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact tested v0.3 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          expected = {
              0: 'b17dc6419c6ca9e0ed0abcc8e25220b4ee371bf2',
              1: '4f1c2ab645dd00ce332eeaa157f8dfbef70cabff',
              2: 'd857e3b65dd9544af96b50240a61cabf5eb51cf9',
              3: '5a9f3cd20d9bad94dfdfaf7fbfa18a53d09dd158',
          }
          def git_blob_sha(data):
              return hashlib.sha1((f'blob {len(data)}\0').encode() + data).hexdigest()

          parts = []
          for i in range(4):
              p = Path(f'.payload/part{i:02d}')
              data = p.read_bytes()
              target = expected[i]
              if git_blob_sha(data) != target:
                  if i != 0 or len(data) != 17001:
                      raise RuntimeError(f'Unexpected payload mismatch for part{i:02d}: len={len(data)} sha={git_blob_sha(data)}')
                  fixed = None
                  for pos in range(len(data)):
                      candidate = data[:pos] + data[pos+1:]
                      if git_blob_sha(candidate) == target:
                          print(f'Removed one transport byte from part00 at offset {pos}: {data[pos:pos+1]!r}')
                          fixed = candidate
                          break
                  if fixed is None:
                      raise RuntimeError('Could not repair part00 to the known tested-source blob SHA')
                  data = fixed
              print(f'part{i:02d}: {len(data)} bytes, verified {git_blob_sha(data)}')
              parts.append(data)

          encoded = b''.join(parts)
          raw = base64.b64decode(encoded, validate=True)
          if raw[:2] != b'\x1f\x8b':
              raise RuntimeError('Reconstructed payload is not gzip data')
          Path('/tmp/astrozotero-v0.3.tar.gz').write_bytes(raw)
          print('payload decoded:', len(raw), 'bytes')
          PY

          rm -rf content defaults locale chrome.manifest install.rdf
          tar -xzf /tmp/astrozotero-v0.3.tar.gz -C .
          rm -rf .payload
          rm -f .github/workflows/release-v0.3.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          python - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as f:
              m = json.load(f)
          assert m['version'] == '0.3', m['version']
          assert m['applications']['zotero']['strict_min_version'] == '7.0.0'
          assert m['applications']['zotero']['strict_max_version'] == '9.0.*'
          print('manifest verified:', m['version'])
          PY

      - name: Commit clean v0.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release AstroZotero v0.3'
          git push origin main

      - name: Build and verify release XPI
        shell: bash
        run: |
          set -euo pipefail
          zip -qr AstroZotero-0.3.xpi \
            manifest.json bootstrap.js astro-map.js zot-nasa-ads.js \
            preferences.js preferences.xhtml prefs.js updates.json zoteroPane.css \
            icons locale COPYING README.md
          unzip -t AstroZotero-0.3.xpi
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('AstroZotero-0.3.xpi') as z:
              m=json.loads(z.read('manifest.json'))
              assert m['version']=='0.3'
          print('XPI manifest verified: 0.3')
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.3 --yes >/dev/null 2>&1 || true
          git tag -d v0.3 >/dev/null 2>&1 || true
          git push origin :refs/tags/v0.3 >/dev/null 2>&1 || true
          gh release create v0.3 AstroZotero-0.3.xpi \
            --target main \
            --title 'AstroZotero v0.3' \
            --notes 'Astronomy-focused Zotero workflow powered by NASA ADS. Includes ADS metadata enrichment, Best/Published PDF retrieval, embedded Astro Map (Cited by, References, Similar, Reviews, Useful, Trending), OpenAlex fallback, whole-library matching, and single/batch Zotero import.'
