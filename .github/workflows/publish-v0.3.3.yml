name: Publish AstroZotero v0.3.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.3.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          node --check astro-map.js
          node --check zot-nasa-ads.js
          node --check bootstrap.js
          node --check preferences.js
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool updates.json >/dev/null
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" = "0.3.3"
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["applications"]["zotero"]["strict_max_version"])')" = "10.0.*"

      - name: Build XPI
        shell: bash
        run: |
          zip -r AstroZotero-0.3.3.xpi \
            manifest.json bootstrap.js zot-nasa-ads.js astro-map.js \
            preferences.js preferences.xhtml prefs.js zoteroPane.css \
            updates.json COPYING README.md icons locale
          sha256sum AstroZotero-0.3.3.xpi

      - name: Create stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.3 \
            AstroZotero-0.3.3.xpi \
            --target "$GITHUB_SHA" \
            --title "AstroZotero v0.3.3" \
            --latest \
            --notes $'Adds Zotero 10 compatibility while keeping Zotero 7-9 support.\n\n- Extends plugin compatibility through Zotero 10.0.x.\n- Retries transient NASA ADS failures before OpenAlex fallback.\n- Marks OpenAlex fallback results as incomplete instead of treating them as the full seed result set.\n- Adds Retry ADS behavior and avoids caching incomplete fallback graphs.\n- Retains the v0.3.2 Astro Map Load more behavior, ADS metadata enrichment, PDF retrieval, and Zotero import workflow.'
