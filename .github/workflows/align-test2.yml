name: Align functional source with 0.3.2-test2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-test2.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact test2 functional files
        shell: bash
        run: |
          cat .astrozotero-sync/part00 .astrozotero-sync/part01 .astrozotero-sync/part02 .astrozotero-sync/part03 .astrozotero-sync/part04 .astrozotero-sync/part05 .astrozotero-sync/part06 .astrozotero-sync/part07 .astrozotero-sync/part08 .astrozotero-sync/part09 > /tmp/test2.b64
          base64 -d /tmp/test2.b64 > /tmp/test2.tar.bz2
          echo "56c7d11790b458698300a624c176847972ebb6a2100ac1dfc1bd9fff28010a77  /tmp/test2.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/test2.tar.bz2
          echo "3c537656f25dde4923d92b90939a416b18b958d8f32ce063f7d3408985d203c4  astro-map.js" | sha256sum -c -
          echo "6169ab6fbfd1d1f7bae845dc0ac5b82ef154575f8df0d3e7ddcb92bf6408e48d  zot-nasa-ads.js" | sha256sum -c -
          echo "f8d8be63bba09442632e7b71590da823ef3bd8b369e976eff67cc612dcc8196d  manifest.json" | sha256sum -c -
      - name: Commit source alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro-map.js zot-nasa-ads.js manifest.json
          git commit -m "Align functional source with AstroZotero 0.3.2-test2"
          git push
