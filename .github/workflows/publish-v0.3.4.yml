          import json
          from pathlib import Path

          prefs = Path("prefs.js")
          s = prefs.read_text()
          old = 'pref("extensions.zotnasaads.mapEnabled", false);'
          new = '// Legacy preference retained for upgrade compatibility; Astro Map now always starts closed.\n' + old
          if new not in s:
              if old not in s:
                  raise SystemExit("mapEnabled preference not found")
              s = s.replace(old, new, 1)
          prefs.write_text(s)

          manifest = Path("manifest.json")
          m = json.loads(manifest.read_text())
          m["version"] = "0.3.4"
          m["applications"]["zotero"]["strict_min_version"] = "7.0.0"
          m["applications"]["zotero"]["strict_max_version"] = "10.0.*"
          manifest.write_text(json.dumps(m, indent=2, ensure_ascii=False) + "\n")

