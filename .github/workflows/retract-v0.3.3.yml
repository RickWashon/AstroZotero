name: Retract AstroZotero v0.3.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retract-v0.3.3.yml

permissions:
  contents: write

jobs:
  retract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete broken v0.3.3 release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.3.3 --cleanup-tag -y || true
