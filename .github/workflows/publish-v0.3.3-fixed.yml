name: Publish AstroZotero v0.3.3 fixed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.3.3-fixed.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Zotero 10 cold-start and toolbar-order fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path("astro-map.js")
          s = p.read_text()

          old = """    // Zotero 9 builds the virtualized item tree and its toolbar asynchronously.
              // Wait for both elements instead of using the obsolete
              // #zotero-tb-advanced-search anchor used by older Style builds.
              while (tries < 200) {
                mainNode = doc.getElementById("item-tree-main-default");
                toolbar = doc.getElementById("zotero-items-toolbar");
                if (mainNode && toolbar) break;
                await Zotero.Promise.delay(100);
                tries++;
              }
              if (!mainNode || !toolbar) {
                this.log("Library item tree/toolbar not available after waiting; embedded map not installed.");
                this.installToolsFallback(win);
                return;
              }
          """
          new = """    // Zotero 9/10 builds the virtualized item tree and toolbar asynchronously.
              // Zotero 10 can restore a non-default item-tree view whose id is not
              // item-tree-main-default (for example item-tree-main-recentlyRead).
              // Match any main item-tree view and allow a longer cold-start window.
              while (tries < 600) {
                mainNode = doc.getElementById("item-tree-main-default") ||
                  doc.querySelector('[id^="item-tree-main"]');
                toolbar = doc.getElementById("zotero-items-toolbar");
                if (mainNode && toolbar) break;
                await Zotero.Promise.delay(100);
                tries++;
              }
              if (!mainNode || !toolbar) {
                this.log("Library item tree/toolbar not available after cold-start wait; embedded map not installed. " +
                  "tree=" + (mainNode?.id || "none") + ", toolbar=" + Boolean(toolbar));
                this.installToolsFallback(win);
                return;
              }
          """
          if old not in s:
              raise SystemExit("cold-start block not found")
          s = s.replace(old, new, 1)

          old = """    const reload = this.makeButton(doc, "Load", async () => this.loadMap(state, true));
              const loadMore = this.makeButton(doc, "Load more", async () => this.loadMore(state));
              loadMore.disabled = true;
              state.loadMoreButton = loadMore;
              const useSelection = this.makeButton(doc, "Use selected item", async () => this.loadFromCurrentSelection(state, true));
          """
          new = """    const useSelection = this.makeButton(doc, "Use selected item", async () => this.loadFromCurrentSelection(state, true));
              const reload = this.makeButton(doc, "Load", async () => this.loadMap(state, true));
              const loadMore = this.makeButton(doc, "Load more", async () => this.loadMore(state));
              loadMore.disabled = true;
              state.loadMoreButton = loadMore;
          """
          if old not in s:
              raise SystemExit("toolbar creation block not found")
          s = s.replace(old, new, 1)

          old = "    header.append(reload, loadMore, useSelection, resetView, selectNew, addSelected);"
          new = "    header.append(useSelection, reload, loadMore, resetView, selectNew, addSelected);"
          if old not in s:
              raise SystemExit("toolbar append block not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("bootstrap.js")
          s = p.read_text()
          old = "    await AstroZoteroMap.addToWindow(win, ZotNasaAds);"
          new = """    AstroZoteroMap.addToWindow(win, ZotNasaAds).catch(error =>
                log("Astro Map window install failed: " + (error?.stack || error))
              );"""
          if old not in s:
              raise SystemExit("startup map await not found")
          s = s.replace(old, new, 1)

          old = "  if (AstroZoteroMap) await AstroZoteroMap.addToWindow(window, ZotNasaAds);"
          new = """  if (AstroZoteroMap) AstroZoteroMap.addToWindow(window, ZotNasaAds).catch(error =>
              log("Astro Map main-window install failed: " + (error?.stack || error))
            );"""
          if old not in s:
              raise SystemExit("window-load map await not found")
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("manifest.json")
          m = json.loads(p.read_text())
          m["version"] = "0.3.3"
          m["applications"]["zotero"]["strict_min_version"] = "7.0.0"
          m["applications"]["zotero"]["strict_max_version"] = "10.0.*"
          p.write_text(json.dumps(m, indent=2, ensure_ascii=False) + "\n")

          updates = {
              "addons": {
                  "zot-nasa-ads@zot.nasa.ads": {
                      "updates": [{
                          "version": "0.3.3",
                          "update_link": "https://github.com/RickWashon/AstroZotero/releases/download/v0.3.3/AstroZotero-0.3.3.xpi",
                          "applications": {
                              "zotero": {
                                  "strict_min_version": "7.0.0",
                                  "strict_max_version": "10.0.*"
                              }
                          }
                      }]
                  }
              }
          }
          Path("updates.json").write_text(json.dumps(updates, indent=2) + "\n")

          p = Path("README.md")
          r = p.read_text()
          marker = "For transient ADS network/rate-limit/server errors, AstroZotero retries the ADS request before falling back to OpenAlex. Fallback results are labeled as incomplete, are not cached as complete seed results, and can be retried from the map.\n"
          extra = marker + "\n### Zotero 10 startup compatibility\n\n- Handles cold starts and restored non-default item-tree views in Zotero 10.\n- Installs Astro Map asynchronously so delayed item-tree initialization does not block plugin startup.\n- Places **Use selected item** before **Load** in the Astro Map controls.\n"
          if marker in r and "### Zotero 10 startup compatibility" not in r:
              r = r.replace(marker, extra)
          p.write_text(r)
          PY

      - name: Validate source
        shell: bash
        run: |
          node --check astro-map.js
          node --check zot-nasa-ads.js
          node --check bootstrap.js
          node --check preferences.js
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool updates.json >/dev/null
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')" = "0.3.3"
          test "$(python3 -c 'import json; print(json.load(open("manifest.json"))["applications"]["zotero"]["strict_max_version"])')" = "10.0.*"
          grep -q 'querySelector.*item-tree-main' astro-map.js
          grep -q 'header.append(useSelection, reload, loadMore' astro-map.js
          grep -q 'Astro Map window install failed' bootstrap.js

      - name: Build XPI
        shell: bash
        run: |
          zip -r AstroZotero-0.3.3.xpi \
            manifest.json bootstrap.js zot-nasa-ads.js astro-map.js \
            preferences.js preferences.xhtml prefs.js zoteroPane.css \
            updates.json COPYING README.md icons locale
          sha256sum AstroZotero-0.3.3.xpi

      - name: Commit fixed v0.3.3 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publish-v0.3.3-fixed.yml
          git add astro-map.js bootstrap.js manifest.json updates.json README.md .github/workflows || true
          git commit -m "Release AstroZotero v0.3.3 with Zotero 10 cold-start support"
          git push origin HEAD:main
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create stable v0.3.3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.3 \
            AstroZotero-0.3.3.xpi \
            --target "$NEW_SHA" \
            --title "AstroZotero v0.3.3" \
            --latest \
            --notes $'Zotero 10 compatibility and Astro Map reliability update.\n\n- Supports Zotero 7 through Zotero 10.\n- Fixes Astro Map toolbar injection after a Zotero 10 cold start or restored non-default item-tree view.\n- Installs Astro Map asynchronously so delayed UI initialization does not block plugin startup.\n- Retries transient NASA ADS failures before OpenAlex fallback.\n- Marks fallback graphs incomplete and exposes Retry ADS instead of false No more results.\n- Moves Use selected item before Load in the Astro Map controls.'
